name: S00 TestFlight preparation and explicit upload

on:
  push:
    branches: [main, codex/s00-b-first-real-pulse, codex/s00-c-continuous-pulses, codex/s00-d-real-today-report]
    paths:
      - audits/S00/s00-testflight-upload-once-20261003-xcodegen-entitlements.json
      - reports/S00-B/round-01/evidence/s00b-upload-once.json
      - reports/S00-C/round-01/evidence/s00c-prepare-once.json
      - reports/S00-C/round-01/evidence/s00c-upload-once.json
      - reports/S00-D/round-01/evidence/s00d-prepare-once.json
      - reports/S00-D/round-01/evidence/s00d-upload-once.json
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare only, or explicitly upload Everwhile to TestFlight
        required: true
        type: choice
        options: [prepare-only, upload, verify-build]
        default: prepare-only
      build_number:
        description: Exact build for a read-only internal TestFlight availability check
        required: false
        type: string

permissions:
  contents: read

jobs:
  testflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'verify-build') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/s00-b-first-real-pulse' && github.event.head_commit.message == 'S00-B explicit one-time TestFlight upload') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/s00-c-continuous-pulses' && (github.event.head_commit.message == 'S00-C explicit one-time TestFlight prepare' || github.event.head_commit.message == 'S00-C explicit one-time TestFlight upload')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/s00-d-real-today-report' && (github.event.head_commit.message == 'S00-D explicit one-time TestFlight prepare' || github.event.head_commit.message == 'S00-D explicit one-time TestFlight upload'))
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate an explicit one-time upload marker
        if: github.event_name == 'push'
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          previous_main = os.environ['PREVIOUS_MAIN_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', previous_main)
          ref = os.environ['GITHUB_REF']
          if ref == 'refs/heads/main':
              marker_path = 'audits/S00/s00-testflight-upload-once-20261003-xcodegen-entitlements.json'
              expected = {
                  'operation': 's00-testflight-upload-once',
                  'trigger_id': 'everwhile-s00-xcodegen-entitlements-20261003',
                  'source_baseline': '8c7268a24e3c2d5238d20f224915a38d2e74f2df',
                  'version': '0.1.0',
              }
          elif ref == 'refs/heads/codex/s00-b-first-real-pulse':
              marker_path = 'reports/S00-B/round-01/evidence/s00b-upload-once.json'
              expected = None
          elif ref == 'refs/heads/codex/s00-c-continuous-pulses':
              operation = 'prepare' if subprocess.check_output(
                  ['git', 'log', '-1', '--format=%s'], text=True
              ).strip() == 'S00-C explicit one-time TestFlight prepare' else 'upload'
              marker_path = f'reports/S00-C/round-01/evidence/s00c-{operation}-once.json'
              expected = {
                  'operation': f's00c-testflight-{operation}-once',
                  'trigger_id': f'everwhile-s00c-continuous-pulses-{operation}-20261003',
                  'source_code_sha': previous_main,
                  'version': '0.1.0',
              }
          elif ref == 'refs/heads/codex/s00-d-real-today-report':
              operation = 'prepare' if subprocess.check_output(
                  ['git', 'log', '-1', '--format=%s'], text=True
              ).strip() == 'S00-D explicit one-time TestFlight prepare' else 'upload'
              marker_path = f'reports/S00-D/round-01/evidence/s00d-{operation}-once.json'
              expected = {
                  'operation': f's00d-testflight-{operation}-once',
                  'trigger_id': f'everwhile-s00d-real-today-report-{operation}-20261004',
                  'source_code_sha': previous_main,
                  'version': '0.1.0',
              }
          else:
              raise AssertionError('Unexpected upload ref')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-status', previous_main, 'HEAD', '--', marker_path], text=True
          ).strip()
          assert changed == 'A\t' + marker_path, 'Upload marker must be newly added by this push'
          if ref in ('refs/heads/codex/s00-c-continuous-pulses', 'refs/heads/codex/s00-d-real-today-report'):
              all_changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', previous_main, 'HEAD'], text=True
              ).strip()
              assert all_changed == marker_path, 'S00-C trigger commit must contain only its marker'
          marker = json.loads(
              Path(marker_path).read_text(encoding='utf-8')
          )
          if expected is None:
              expected = {
                  'operation': 's00b-testflight-upload-once',
                  'trigger_id': 'everwhile-s00b-first-pulse-20261003',
                  'source_code_sha': previous_main,
                  'version': '0.1.0',
              }
          assert marker == expected
          print('S00_TF_ONE_TIME_MARKER_VALID')
          PY
      - name: Record Xcode 26 host and toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, parts, "."); print parts[1]}')
          test "$major" -ge 26
      - name: Run pure logic tests and lint distribution resources
        run: |
          set -euo pipefail
          swift test
          python3 -m unittest discover -s scripts/tests
          plutil -lint AppResources/PrivacyInfo.xcprivacy
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (Path('scripts/s00_testflight_diagnostics.py'), Path('scripts/s00_signing_settings.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python release helpers parsed successfully')
          PY
      - name: Use verified XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version
      - name: Generate project and validate release helpers
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          python3 - <<'PY'
          import plistlib
          for path in (
              "App/Elapse.entitlements",
              "MonitorExtension/ElapseMonitor.entitlements",
              "ReportExtension/ElapseReport.entitlements",
          ):
              with open(path, "rb") as f:
                  data = plistlib.load(f)
              assert data.get("com.apple.developer.family-controls") is True, path
              if path != "ReportExtension/ElapseReport.entitlements":
                  assert data.get("com.apple.security.application-groups") == ["group.com.zhangsfish.elapse"], path
          print("S00_TF_XCODEGEN_FAMILY_CONTROLS_ENTITLEMENTS_PASS")
          print("S00B_TF_XCODEGEN_APP_GROUP_ENTITLEMENTS_PASS")
          PY
          xcodebuild -help 2>&1 | grep -E 'app-store-connect|destination.*upload|testFlightInternalTestingOnly' || true
          xcrun altool --help 2>&1 | grep -E -- 'upload-app|apiKey|apiIssuer' | head -n 12
          bash -n scripts/s00_testflight_release.sh
          swiftc -typecheck scripts/s00_testflight_status.swift
          icon='App/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          test "$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')" = '1024'
          test "$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')" = '1024'
      - name: Inspect effective Release signing settings safely
        run: python3 scripts/s00_signing_settings.py
      - name: Clean unsigned iPhone Release build
        run: |
          set -euo pipefail
          xcodebuild -project Elapse.xcodeproj -scheme Elapse \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/S00EverwhileDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO clean build

          app="$RUNNER_TEMP/S00EverwhileDeviceDerivedData/Build/Products/Release-iphoneos/Elapse.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'com.zhangsfish.elapse'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 'Everwhile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist")" = 'AppIcon'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '0.1.0'
          test -f "$app/PrivacyInfo.xcprivacy"
          plutil -lint "$app/PrivacyInfo.xcprivacy"

          for extension in \
            'PlugIns/ElapseMonitor.appex|com.zhangsfish.elapse.monitor|privacy' \
            'Extensions/ElapseReport.appex|com.zhangsfish.elapse.report|no-privacy'; do
            bundle_name=$(echo "$extension" | cut -d'|' -f1)
            expected_id=$(echo "$extension" | cut -d'|' -f2)
            privacy=$(echo "$extension" | cut -d'|' -f3)
            bundle="$app/$bundle_name"
            test -d "$bundle"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")" = "$expected_id"
            if [[ "$privacy" == 'privacy' ]]; then
              test -f "$bundle/PrivacyInfo.xcprivacy"
              plutil -lint "$bundle/PrivacyInfo.xcprivacy"
            fi
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/PlugIns/ElapseMonitor.appex/Info.plist")" = 'Everwhile Monitor'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Extensions/ElapseReport.appex/Info.plist")" = 'Everwhile Report'
      - name: Create and inspect unsigned distribution archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/S00-Everwhile-Prepare.xcarchive"
          build_number="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild -project Elapse.xcodeproj -scheme Elapse \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/S00EverwhileArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$build_number" archive

          app="$archive/Products/Applications/Elapse.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'com.zhangsfish.elapse'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 'Everwhile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist")" = 'AppIcon'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$build_number"
          test -f "$app/PrivacyInfo.xcprivacy"

          for bundled_extension in \
            'PlugIns/ElapseMonitor.appex|com.zhangsfish.elapse.monitor' \
            'Extensions/ElapseReport.appex|com.zhangsfish.elapse.report'; do
            bundle_name=${bundled_extension%%|*}
            expected_id=${bundled_extension#*|}
            info="$app/$bundle_name/Info.plist"
            test -f "$info"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$expected_id"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$build_number"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/PlugIns/ElapseMonitor.appex/Info.plist")" = 'Everwhile Monitor'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Extensions/ElapseReport.appex/Info.plist")" = 'Everwhile Report'
          python3 scripts/s00_archive_inspect.py "$archive" --require-distribution-metadata
      - name: Sign and upload only on an explicit upload trigger
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'upload') ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/s00-b-first-real-pulse')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/s00-c-continuous-pulses' && github.event.head_commit.message == 'S00-C explicit one-time TestFlight upload') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/s00-d-real-today-report' && github.event.head_commit.message == 'S00-D explicit one-time TestFlight upload')
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash scripts/s00_testflight_release.sh

  verify-build:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-build'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query only the specified Everwhile internal build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash scripts/s00a_verify_internal.sh
