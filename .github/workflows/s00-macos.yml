name: S00 Screen Time feasibility verification

on:
  push:
    branches: [codex/s00-screen-time-feasibility]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s00-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Use verified XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build app and Screen Time extensions for Simulator
        run: |
          set -euo pipefail
          xcodebuild -project Elapse.xcodeproj -scheme Elapse \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ElapseBuild" \
            CODE_SIGNING_ALLOWED=NO clean build
      - name: Probe ad-hoc entitlement signing safely
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ElapseBuild/Build/Products/Debug-iphonesimulator/Elapse.app"
          probe_root="$RUNNER_TEMP/S00EntitlementProbe"
          rm -rf "$probe_root"
          mkdir -p "$probe_root"

          probe_bundle() {
            local source_bundle="$1"
            local entitlements="$2"
            local expected_id="$3"
            local tag="$4"
            local bundle="$probe_root/$tag.appex"
            local dumped="$probe_root/$tag-entitlements.plist"

            test "$(plutil -extract com.apple.developer.family-controls raw -o - "$entitlements")" = "true"
            cp -R "$source_bundle" "$bundle"
            codesign -s - -f --entitlements "$entitlements" "$bundle"
            codesign --display --entitlements - --xml "$bundle" > "$dumped"
            value="$(plutil -extract com.apple.developer.family-controls raw -o - "$dumped" 2>/dev/null || true)"
            echo "S00_ADHOC_PROBE bundle=$expected_id family_controls=$value"
            test "$value" = "true"
          }

          probe_bundle "$app/PlugIns/ElapseMonitor.appex"             MonitorExtension/ElapseMonitor.entitlements             com.zhangsfish.elapse.monitor monitor
          probe_bundle "$app/Extensions/ElapseReport.appex"             ReportExtension/ElapseReport.entitlements             com.zhangsfish.elapse.report report
      - name: Validate release helpers
        run: |
          set -euo pipefail
          bash -n scripts/s00_testflight_release.sh
          python3 -m unittest discover -s scripts/tests
      - name: Run pure logic unit tests
        run: swift test
