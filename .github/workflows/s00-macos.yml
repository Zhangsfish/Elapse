name: S00 Screen Time feasibility verification

on:
  push:
    branches: [codex/s00-screen-time-feasibility]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s00-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Use verified XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Probe codesign entitlement semantics
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.family-controls' MonitorExtension/ElapseMonitor.entitlements)" = "true"
          cp /bin/echo "$RUNNER_TEMP/entitlement-probe"
          chmod u+w "$RUNNER_TEMP/entitlement-probe"
          codesign --force --sign - --entitlements MonitorExtension/ElapseMonitor.entitlements "$RUNNER_TEMP/entitlement-probe"
          codesign --display --entitlements - --xml "$RUNNER_TEMP/entitlement-probe" > "$RUNNER_TEMP/entitlement-probe.plist"
          value="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.family-controls' "$RUNNER_TEMP/entitlement-probe.plist" 2>/dev/null || true)"
          echo "S00_CODESIGN_PROBE family_controls=$value"
          test "$value" = "true"
      - name: Build app and Screen Time extensions for Simulator
        run: |
          set -euo pipefail
          xcodebuild -project Elapse.xcodeproj -scheme Elapse \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ElapseBuild" \
            CODE_SIGNING_ALLOWED=NO clean build
      - name: Validate release helpers
        run: |
          set -euo pipefail
          bash -n scripts/s00_testflight_release.sh
          python3 -m unittest discover -s scripts/tests
      - name: Run pure logic unit tests
        run: swift test
