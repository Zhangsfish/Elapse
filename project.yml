name: Elapse
options:
  bundleIdPrefix: com.zhangsfish
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Elapse:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: AppResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ElapseMonitor
        embed: true
      - target: ElapseReport
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangsfish.elapse
        PRODUCT_NAME: Elapse
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Everwhile
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    entitlements:
      path: App/Elapse.entitlements
  ElapseMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: MonitorExtension
      - path: Shared
      - path: AppResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangsfish.elapse.monitor
        PRODUCT_NAME: ElapseMonitor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: Everwhile Monitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ElapseMonitorExtension"
    entitlements:
      path: MonitorExtension/ElapseMonitor.entitlements
  ElapseReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ReportExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangsfish.elapse.report
        PRODUCT_NAME: ElapseReport
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ReportExtension/Info.plist
      properties:
        CFBundleDisplayName: Everwhile Report
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: ReportExtension/ElapseReport.entitlements
schemes:
  Elapse:
    build:
      targets:
        Elapse: all
        ElapseMonitor: all
        ElapseReport: all
